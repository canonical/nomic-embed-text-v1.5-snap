name: cpu
summary: CPU inference for Nomic Embed Text v1.5
description: |
  Runs the Nomic Embed Text v1.5 embedding model on the CPU using the llama.cpp runtime.
  Optimized for several CPU variants (x86, armv8, armv9).
vendor: Canonical Ltd
devices:
  allof:
    - type: cpu
runtime: llamacpp
model:
  default: nomic-embed-text-v1-5
  options:
    - nomic-embed-text-v1-5
configurations:
  sleep-idle-seconds: 600
